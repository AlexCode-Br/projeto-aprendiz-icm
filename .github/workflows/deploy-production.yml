name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: projeto_aprendiz_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d projeto_aprendiz_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm audit
      - run: pnpm test:postgres
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/projeto_aprendiz_test
          DATABASE_SSL: "false"
      - run: pnpm cloudflare:build

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://aprendizicm.com.br
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_SSL: "true"
      SUPABASE_CA_CERT: ${{ secrets.SUPABASE_CA_CERT }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Check deployment credentials
        shell: bash
        run: |
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DATABASE_URL SUPABASE_CA_CERT; do
            if [ -z "${!key}" ]; then
              echo "Missing production secret: $key"
              exit 1
            fi
          done
      - name: Configure trusted Supabase CA
        shell: bash
        run: |
          umask 077
          certificate_path="$RUNNER_TEMP/supabase-ca.crt"
          printf '%s\n' "$SUPABASE_CA_CERT" > "$certificate_path"
          openssl x509 -in "$certificate_path" -noout
          echo "NODE_EXTRA_CA_CERTS=$certificate_path" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - name: Migrate and publish
        run: pnpm cloudflare:deploy
      - name: Check public endpoints
        run: node scripts/smoke-production.mjs
