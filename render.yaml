services:
  - type: web
    name: projeto-aprendiz
    runtime: node
    plan: free
    region: virginia
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: "false"
      - key: DB_POOL_SIZE
        value: "5"
      - key: AUTH_PROVIDER
        value: supabase
      - key: APP_TIMEZONE
        value: America/Sao_Paulo
      - key: SUPABASE_ANNOUNCEMENT_BUCKET
        value: announcement-attachments
      - key: SUPABASE_URL
        value: https://ggghsddanuuekztxngxj.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: VITE_SUPABASE_URL
        value: https://ggghsddanuuekztxngxj.supabase.co
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SEED_DEMO_DATA
        value: "false"
      - key: BOOTSTRAP_ADMIN_NAME
        value: Gestor
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: naoresponda@aprendizicm.com.br
      - key: EMAIL_REPLY_TO
        sync: false
      - key: EMAIL_LOGO_URL
        value: https://aprendizicm.com.br/projeto-aprendiz-logo.png
      - key: EMAIL_DEPARTMENT_LOGO_URL
        value: https://aprendizicm.com.br/departamento-louvor-logo.png
